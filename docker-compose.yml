  # ── Redis (Rate Limiting) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mininetflix-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

